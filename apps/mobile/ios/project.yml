name: HTTPCaptureMobile
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ONLY_ACTIVE_ARCH: YES
targets:
  HTTPCaptureMobile:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, App.entitlements]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.httpcapture.mobile.ios
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    dependencies:
      - target: PacketTunnel
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes: [Info.plist, PacketTunnel.entitlements]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.httpcapture.mobile.ios.PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: native/include/http_capture_ios.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/native"
        OTHER_LDFLAGS: "$(inherited) -lhttp_capture_ios -lresolv -lz"
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    preBuildScripts:
      - name: Build Rust capture engine
        script: /bin/sh "$SRCROOT/build-native.sh"
        basedOnDependencyAnalysis: false
