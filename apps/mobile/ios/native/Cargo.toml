[package]
name = "http-capture-ios"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
capture-core = { path = "../../../../crates/capture-core" }
serde_json.workspace = true
base64 = "0.22"
tokio.workspace = true
tun2proxy = { version = "0.7.15", default-features = false }
uuid = { version = "1", features = ["v4"] }
# The shared engine needs generated bindings on iOS and on local cross-check targets.
rquickjs = { version = "0.14", features = ["bindgen"] }

[dev-dependencies]
etherparse = "0.20.3"
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
