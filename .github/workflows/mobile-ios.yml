name: iOS mobile build

on:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test request body codec
        run: |
          swiftc apps/mobile/ios/App/RequestBodyCodec.swift apps/mobile/ios/App/RecordedRequestCopy.swift apps/mobile/ios/App/FlowDetailFormatter.swift apps/mobile/ios/tests/main.swift -o /tmp/http-capture-ios-body-tests
          /tmp/http-capture-ios-body-tests
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          cd apps/mobile/ios
          xcodegen generate
      - name: Build unsigned simulator app and Packet Tunnel
        run: |
          simulator_arch="$(uname -m)"
          case "$simulator_arch" in
            arm64|x86_64) ;;
            *) echo "Unsupported macOS runner architecture: $simulator_arch" >&2; exit 1 ;;
          esac
          xcodebuild \
            -project apps/mobile/ios/HTTPCaptureMobile.xcodeproj \
            -scheme HTTPCaptureMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath apps/mobile/ios/build/DerivedData \
            ARCHS="$simulator_arch" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify app and extension
        run: |
          simulator_arch="$(uname -m)"
          app=apps/mobile/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/HTTPCaptureMobile.app
          test -d "$app"
          test -d "$app/PlugIns/PacketTunnel.appex"
          test -f "$app/PlugIns/PacketTunnel.appex/PacketTunnel"
          lipo -verify_arch "$simulator_arch" "$app/HTTPCaptureMobile"
          lipo -verify_arch "$simulator_arch" "$app/PlugIns/PacketTunnel.appex/PacketTunnel"
      - name: Package unsigned simulator app
        run: |
          app=apps/mobile/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/HTTPCaptureMobile.app
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/http-capture-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: http-capture-ios-simulator
          path: ${{ runner.temp }}/http-capture-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
      - name: Build unsigned iPhone app and Packet Tunnel
        run: |
          xcodebuild \
            -project apps/mobile/ios/HTTPCaptureMobile.xcodeproj \
            -scheme HTTPCaptureMobile \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath apps/mobile/ios/build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify iPhone app and extension
        run: |
          app=apps/mobile/ios/build/DerivedData/Build/Products/Debug-iphoneos/HTTPCaptureMobile.app
          test -f "$app/HTTPCaptureMobile"
          test -f "$app/PlugIns/PacketTunnel.appex/PacketTunnel"
          lipo -verify_arch arm64 "$app/HTTPCaptureMobile"
          lipo -verify_arch arm64 "$app/PlugIns/PacketTunnel.appex/PacketTunnel"
