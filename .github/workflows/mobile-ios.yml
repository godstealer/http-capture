name: iOS mobile build

on:
  workflow_dispatch:
  push:
    branches: [codex/mcp-integration]
    paths:
      - 'apps/mobile/ios/**'
      - 'crates/capture-core/**'
      - 'vendor/tun2proxy/**'
      - 'Cargo.lock'
      - '.github/workflows/mobile-ios.yml'

jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test iOS native packet bridge and HTTPS capture
        run: cargo test --locked -p http-capture-ios --lib
      - name: Test mobile request and response body codecs
        run: |
          swiftc apps/mobile/ios/App/RequestBodyCodec.swift apps/mobile/ios/App/ResponseBodyCodec.swift apps/mobile/ios/App/RecordedRequestCopy.swift apps/mobile/ios/App/FlowDetailFormatter.swift apps/mobile/ios/tests/main.swift -o /tmp/http-capture-ios-body-tests
          /tmp/http-capture-ios-body-tests
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          cd apps/mobile/ios
          xcodegen generate
      - name: Build unsigned simulator app and Packet Tunnel
        run: |
          simulator_arch="$(uname -m)"
          case "$simulator_arch" in
            arm64|x86_64) ;;
            *) echo "Unsupported macOS runner architecture: $simulator_arch" >&2; exit 1 ;;
          esac
          xcodebuild \
            -project apps/mobile/ios/HTTPCaptureMobile.xcodeproj \
            -scheme HTTPCaptureMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath apps/mobile/ios/build/DerivedData \
            ARCHS="$simulator_arch" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify app and extension
        run: |
          simulator_arch="$(uname -m)"
          app=apps/mobile/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/HTTPCaptureMobile.app
          test -d "$app"
          test -d "$app/PlugIns/PacketTunnel.appex"
          test -f "$app/PlugIns/PacketTunnel.appex/PacketTunnel"
          lipo "$app/HTTPCaptureMobile" -verify_arch "$simulator_arch"
          lipo "$app/PlugIns/PacketTunnel.appex/PacketTunnel" -verify_arch "$simulator_arch"
      - name: Launch unsigned app on iOS Simulator
        timeout-minutes: 8
        run: |
          read -r simulator state < <(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [device for group in devices.values() for device in group
                    if device["name"].startswith("iPhone") and device["isAvailable"]]
          if not phones:
              raise SystemExit("No available iPhone simulator")
          choice = next((device for device in phones if device["state"] == "Booted"), phones[0])
          print(choice["udid"], choice["state"])
          ')
          if [ "$state" != Booted ]; then xcrun simctl boot "$simulator"; fi
          xcrun simctl bootstatus "$simulator" -b
          app=apps/mobile/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/HTTPCaptureMobile.app
          xcrun simctl install "$simulator" "$app"
          xcrun simctl launch "$simulator" dev.httpcapture.mobile.ios
          sleep 3
          xcrun simctl io "$simulator" screenshot "$RUNNER_TEMP/http-capture-ios-launch.png"
          test -s "$RUNNER_TEMP/http-capture-ios-launch.png"
      - uses: actions/upload-artifact@v4
        with:
          name: http-capture-ios-launch
          path: ${{ runner.temp }}/http-capture-ios-launch.png
          if-no-files-found: error
          retention-days: 7
      - name: Package unsigned simulator app
        run: |
          app=apps/mobile/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/HTTPCaptureMobile.app
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/http-capture-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: http-capture-ios-simulator
          path: ${{ runner.temp }}/http-capture-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
      - name: Build unsigned iPhone app and Packet Tunnel
        run: |
          xcodebuild \
            -project apps/mobile/ios/HTTPCaptureMobile.xcodeproj \
            -scheme HTTPCaptureMobile \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath apps/mobile/ios/build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify iPhone app and extension
        run: |
          app=apps/mobile/ios/build/DerivedData/Build/Products/Debug-iphoneos/HTTPCaptureMobile.app
          test -f "$app/HTTPCaptureMobile"
          test -f "$app/PlugIns/PacketTunnel.appex/PacketTunnel"
          lipo "$app/HTTPCaptureMobile" -verify_arch arm64
          lipo "$app/PlugIns/PacketTunnel.appex/PacketTunnel" -verify_arch arm64
