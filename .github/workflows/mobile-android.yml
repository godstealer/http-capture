name: Android mobile build

on:
  workflow_dispatch:
  push:
    branches: [codex/mcp-integration]
    paths:
      - 'apps/mobile/android/**'
      - 'scripts/build-android.*'
      - 'crates/capture-core/**'
      - 'vendor/tun2proxy/**'
      - 'Cargo.lock'
      - '.github/workflows/mobile-android.yml'

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # v3 defaults to the removed SDK `tools` package on its pinned release.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.2'
      - name: Verify manual request body bytes
        run: |
          mkdir -p "$RUNNER_TEMP/http-capture-body-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/http-capture-body-tests" \
            apps/mobile/android/app/src/main/java/dev/httpcapture/mobile/RequestBodyCodec.java \
            apps/mobile/android/tests/RequestBodyCodecTest.java
          java -cp "$RUNNER_TEMP/http-capture-body-tests" dev.httpcapture.mobile.RequestBodyCodecTest
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libdbus-1-dev libssl-dev perl make pkg-config
          sdkmanager --install 'platforms;android-33' 'build-tools;33.0.2' 'ndk;27.2.12479018'
      - name: Build Android arm64 and x86_64 APK
        run: |
          libclang="$(find /usr/lib -name libclang.so -print -quit)"
          test -n "$libclang"
          export LIBCLANG_PATH="$(dirname "$libclang")"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash scripts/build-android.sh debug both
      - name: Verify both native architectures are packaged
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libhttp_capture_android.so'
          unzip -Z1 "$apk" | grep -Fx 'lib/x86_64/libhttp_capture_android.so'
      - uses: actions/upload-artifact@v4
        with:
          name: http-capture-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build emulator smoke test APK
        run: gradle -p apps/mobile/android :app:assembleDebugAndroidTest --no-daemon
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test packaged APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: bash scripts/smoke-android.sh
