name: Check
on: [push, pull_request]
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        # Keep native ARM checks on the same macOS image as release packaging.
        os: [ubuntu-latest, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Rust integration tests launch a real Node MCP stdio peer.
      # Use the same runtime as frontend/release instead of the runner image's PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify MCP fixture runtime
        run: node --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config dbus-daemon dconf-cli dconf-service gsettings-desktop-schemas
      - run: cargo test --locked -p transport-api -p transport-httpcloak -p capture-core -p capture-mcp --no-default-features
      - name: Verify GNOME proxy in an isolated session
        if: runner.os == 'Linux'
        run: bash scripts/test-gnome-proxy.sh
      - run: cargo check --locked -p capture-service
      - run: cargo test --locked -p capture-service --bin capture-service
      - run: cargo test --locked -p capture-service --test mcp_stdio
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:frontend
      - run: node scripts/test-ci-retry.cjs
      - run: node scripts/test-platform-release-policy.cjs
      - run: node --test scripts/test-release-updater.mjs scripts/test-verify-published-release.mjs
