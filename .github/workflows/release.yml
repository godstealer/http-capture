name: Release
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            bundles: nsis
          - os: ubuntu-22.04
            label: linux-x64
            bundles: deb,appimage
          - os: macos-15
            label: macos-arm64
            bundles: dmg
          - os: macos-15-intel
            label: macos-x64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: helpers/httpcloak/go.mod
          cache-dependency-path: helpers/httpcloak/go.sum
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libdbus-1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - run: npm ci
      - name: Verify httpcloak helper
        working-directory: helpers/httpcloak
        run: go test -mod=readonly ./...
      - name: Prepare packaged helper and resources
        run: node scripts/prepare-release.mjs
      - name: Build installer
        run: npm run tauri -- build --config "${{ github.workspace }}/apps/desktop/src-tauri/tauri.release.json" --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect installer and checksum
        run: node scripts/collect-release.mjs ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - name: Publish complete prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${SOURCE_SHA:0:12}"
          cat > notes.md <<EOF
          Automated desktop preview from commit ${SOURCE_SHA}.

          Check passed for this exact commit; all four installer builds succeeded.
          Windows x64: NSIS installer. Linux x64: Debian package and portable AppImage (Ubuntu 22.04 baseline). macOS Intel and Apple Silicon: separate DMGs.
          Includes native HTTP/1, HTTP/2, HTTP/3 engines and the httpcloak helper.
          wreq and the optional TUN helper are not included in this package.
          Unsigned preview: no Windows signing or macOS notarization. Installer build success does not replace clean-machine installation and runtime testing.
          Active WebSocket message editing/sending, HAR/session tools, request collections and environments are included.
          Custom ClientHello Hex templates are available through httpcloak (TCP TLS only; ECH/PSK/0-RTT/QUIC imports rejected).
          H3 stream isolation and timeout handling improved; Windows TUN H3 remains unverified. Automatic in-app updates are not enabled.
          SHA256 checksums accompany each installer.
          EOF
          if gh release view "$tag" --json isDraft --jq '.isDraft' > draft.txt 2>/dev/null; then
            if [ "$(cat draft.txt)" != true ]; then
              echo "Release already published; keeping existing assets immutable."
              exit 0
            fi
          else
            gh release create "$tag" --target "$SOURCE_SHA" --title "HTTP Capture preview ${SOURCE_SHA:0:12}" --notes-file notes.md --draft --prerelease
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false
