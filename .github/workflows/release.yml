name: Release
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
  SOURCE_CHECK_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
  SOURCE_CHECK_CREATED_AT: ${{ github.event.workflow_run.created_at }}
  # Optional consistency check; the committed tauri.conf.json is authoritative.
  TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}

jobs:
  preflight:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      staged: ${{ steps.mode.outputs.staged }}
    steps:
      - name: Keep already staged releases on the manual completion path
        id: mode
        uses: actions/github-script@v7
        with:
          script: |
            const sha=context.payload.workflow_run.head_sha;
            if(!/^[a-f0-9]{40}$/.test(sha))throw Error('Invalid source SHA');
            try {
              const {data:release}=await github.rest.repos.getReleaseByTag({...context.repo,tag:`build-${sha.slice(0,12)}`});
              const staged=(!release.draft||release.body?.includes('<!-- staged-platform-release -->'))&&!release.assets.some(asset=>asset.name==='latest.json');
              core.setOutput('staged',String(staged));
              if(staged)core.notice('This source already has a staged public release. Complete missing platforms manually without rebuilding public packages.');
            } catch(error) {
              if(error.status!==404)throw error;
              const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});
              const draft=releases.find(release=>release.tag_name===`build-${sha.slice(0,12)}`&&release.draft&&release.body?.includes('<!-- staged-platform-release -->'));
              core.setOutput('staged',String(Boolean(draft)));
            }
      - uses: actions/checkout@v4
        if: steps.mode.outputs.staged != 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.staged != 'true'
        with:
          node-version: 22
      - name: Verify release and updater fixtures
        if: steps.mode.outputs.staged != 'true'
        run: node --test scripts/test-release-updater.mjs scripts/test-verify-published-release.mjs
      - name: Require updater signing configuration
        if: steps.mode.outputs.staged != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release-updater.mjs preflight
      - name: Fix version from the successful source Check
        if: steps.mode.outputs.staged != 'true'
        id: identity
        shell: bash
        run: echo "version=$(node scripts/release-updater.mjs version)" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    if: needs.preflight.outputs.staged != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            bundles: nsis
          - os: ubuntu-22.04
            label: linux-x64
            bundles: deb,appimage
          - os: macos-26
            label: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            label: macos-x64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: helpers/httpcloak/go.mod
          cache-dependency-path: helpers/httpcloak/go.sum
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libdbus-1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - run: npm ci
      - name: Verify httpcloak helper
        working-directory: helpers/httpcloak
        run: go test -mod=readonly ./...
      - name: Prepare packaged helper and resources
        run: node scripts/prepare-release.mjs
      - name: Build signed updater artifacts and installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --config "${{ github.workspace }}/apps/desktop/src-tauri/tauri.release.json" --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify updater lifecycle
        run: cargo test --release --locked -p http-capture-desktop --bin http-capture app_update::tests
      - name: Collect and validate signed artifacts and checksums
        run: node scripts/collect-release.mjs ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    # Serialize stable Latest and compatibility-channel writes across commits.
    concurrency:
      group: updater-preview-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - name: Require all four signed updater artifacts
        run: node scripts/generate-updater.mjs
      - name: Publish stable build and advance compatible update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
