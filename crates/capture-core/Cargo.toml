[package]
name = "capture-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
browser-replay = ["dep:transport-wreq", "browser-profiles/browser-replay"]

[dependencies]
flate2 = "1"
brotli = "8.0.4"
zstd = "0.13.3"
transport-api = { path = "../transport-api" }
transport-httpcloak = { path = "../transport-httpcloak" }
browser-profiles = { path = "../browser-profiles" }
transport-wreq = { path = "../transport-wreq", optional = true }
if-addrs = "0.14"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
aes-gcm = "0.10"
zeroize = "1"
sha1 = "0.10"
getrandom = "0.2"
md-5 = "0.10"
openssl = { version = "0.10", features = ["vendored"] }
hmac = "0.12"
rquickjs = "0.14"
regex = "1"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64 = "0.22"
x509-parser = "0.16"
sha2 = "0.10"
httparse = "1.10"
rcgen = { version = "0.13.2", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
h2 = "0.4"
http = "1"
bytes = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }

tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading"] }
