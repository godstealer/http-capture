[package]
name = "capture-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
capture-core = { path = "../capture-core" }
rmcp = { version = "=3.5.1", features = ["server", "client", "macros", "schemars", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "transport-child-process"] }
axum = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

