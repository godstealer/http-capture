[package]
name = "browser-profiles"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
browser-replay = ["dep:wreq-util", "dep:wreq"]
[dependencies]
transport-api = { path = "../transport-api" }
anyhow.workspace = true
wreq-util = { version = "=0.2.0", optional = true, features = ["emulation"] }
wreq = { version = "=0.16.1", optional = true, default-features = false, features = ["tokio-rt"] }
[dev-dependencies]
serde_json.workspace = true
